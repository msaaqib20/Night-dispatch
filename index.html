    this.speechEnabled = true;
    this.scene = { hour: 0, tension: 0, emotional: false, dawn: false };
    this.callAmbient = null;
    this.ambientAt = 0;
    this.thunderAt = 0;
    this.tickAt = 0;
    this.scoreAt = 0;
    this.timer = null;
    this.suspended = false;
    this.speechToken = 0;
    this.speechTimers = new Set();
    this.speaking = false;
    this.voices = [];

      try { this.voices = window.speechSynthesis?.getVoices() || []; } catch (_) { this.voices = []; }

        this.master = c.createGain();
        this.master.gain.value = this.volume;

        limiter.threshold.value = -15;
        limiter.knee.value = 24;
        limiter.ratio.value = 5;
        limiter.attack.value = 0.006;

function renderGame(){mapView?.destroy();mapView=null;$('#game').innerHTML=`<header class="appHeader"><div class="brand"><div class="brandIcon">${icon('radio')}</div><div><h1>${esc(t('brand'))}</h1><div class="eyebrow">${esc(L(STORY.city)).toUpperCase()} / ${esc(t('division'))}</div></div></div><div class="headerStatus"><div class="weather"><span id="weatherLabel">${esc(t('storm'))}</span><small>${esc(t('wind'))}</small></div><div><div id="clock" class="digitalClock">${clock(S.minute)}</div><div class="clockLabel">${esc(t('shift'))} / 04</div></div>${action('settings',icon('gear'),'iconButton',`aria-label="${esc(t('settings'))}"`)}</div></header><main class="workspace"><nav class="sideNav" aria-label="${esc(t('console'))}">${['console','logbook','archive','guide'].map((x,i)=>action(x,icon(['radio','book','phone','help'][i])+`<span>${esc(t(x))}</span>`,tab===x?'active':'',`aria-label="${esc(t(x))}"`)).join('')}</nav><div class="leftColumn" ${tab!=='console'?'hidden':''}><section class="consolePanel mapPanel" id="mapPanel"><div class="panelHeader"><span>${esc(t('map'))} / ${esc(L(STORY.city))}</span><span class="right"><i class="dot"></i> ${esc(t('live'))}</span></div><div class="crt"><canvas id="mapCanvas" class="mapCanvas" aria-label="${esc(t('map'))}"></canvas></div><div class="mapBottom"><div class="legend"><span><i></i>${esc(t('resolved'))}</span><span><i class="pending"></i>${esc(t('pending'))}</span><span><i class="flood"></i>${esc(t('flood'))}</span><span><i class="outage"></i>${esc(t('power'))}</span></div><span id="mapStatus">${esc(t('mapOnline'))}</span></div><div id="mapInfo"></div><div id="pendingItems" class="pendingItems"></div></section><section class="consolePanel unitTray"><div class="panelHeader"><span>${esc(t('units'))}</span><span id="unitCount" class="right"></span></div><div id="unitGrid" class="unitGrid"></div><p class="unitHelp">${esc(t('unitHelp'))}</p></section></div><div class="rightColumn" ${tab!=='console'?'hidden':''}><section id="callPanel" class="consolePanel callPanel"><div class="panelHeader"><span>${esc(t('incoming'))}</span><span id="lineStatus" class="right">04 / 04</span></div><div id="callLines" class="callLines"></div><div id="callBody" style="display:contents"></div></section><section class="consolePanel radioPanel"><div class="panelHeader"><span>${esc(t('radio'))}</span><span class="right">${lang==='ru'?'104,6':'104.6'}</span></div><div id="radioDisplay" class="radioDisplay" aria-live="polite"></div><div class="radioBottom"><div class="radioSpeaker"></div>${action('radioCheck',icon('radio'),'ghost small',`aria-label="${esc(t('radioCheck'))}" title="${esc(t('radioCheck'))}"`)}${action('hint',icon('phone')+esc(t('internal')),'small')}</div></section></div><section id="tabPane" class="tabPane" ${tab==='console'?'hidden':''}></section></main><footer class="deskFooter"><div class="systemLabel"><i class="dot"></i><span id="saveStatus">${esc(t('saved'))}</span></div><div class="flex"><span>22:00</span><div class="shiftProgress"><span id="shiftFill"></span></div><span>06:00</span></div><div class="flex"><span id="clockStatus">${esc(t('ticking'))}</span>${action('pause',icon('pause'),'ghost small',`aria-label="${esc(t('pause'))}"`)}<div class="tinyCoffee" aria-hidden="true"></div></div></footer>`;
if(tab==='console'){mapView=new DispatchMap($('#mapCanvas'),{onLocation:selectLocation});renderCalls();renderUnits();renderRadio();renderMapInfo();syncVisuals()}else renderTab();updateClock();}
function lineCalls(){return Object.keys(S.calls).filter(id=>['ringing','active','held'].includes(S.calls[id].status)).sort((a,b)=>{if(a===S.active)return -1;if(b===S.active)return 1;return S.calls[a].ringAt-S.calls[b].ringAt}).slice(0,4)}
function renderLines(){if(!$('#callLines'))return;const ids=lineCalls();$('#callLines').innerHTML=Array.from({length:4},(_,i)=>{const id=ids[i],cs=S.calls[id],status=cs?.status;return `<button data-action="answer" data-id="${id||''}" class="callLine ${id===S.active?'live':status==='ringing'?'ringing':''}" ${!id?'disabled':''} aria-label="${esc(`${t('line')} ${i+1}${id?' · '+t(status==='ringing'?'ringing':status==='held'?'onHold':'connected'):''}`)}"><span class="lineLed"></span><span>${esc(t('line'))} 0${i+1}</span><small>${esc(t(status==='ringing'?'ringing':status==='held'?'onHold':status==='active'?'connected':'idle'))}</small></button>`}).join('');const count=Object.values(S.calls).filter(c=>c.status==='ringing').length;$('#lineStatus').textContent=count?`${count} / ${t('queueFull')}`:`04 / 04`;}
function callText(c,entry){if(entry.kind==='opening')return L(c.opening);if(entry.kind==='followup')return L(c.followup?.[entry.helped?'helped':'missed']);if(entry.kind==='q')return L(c.questions.find(q=>q.id===entry.id)?.reply);if(entry.kind==='close')return L(c.close);return '';}
function renderCalls(){if(!$('#callBody'))return;renderLines();const c=C(S.active),cs=S.calls[S.active];if(!c||!cs){$('#callBody').innerHTML=`<div class="callSurface"><div class="callMeta"><span>${esc(t('consoleOnline'))}</span><span>${clock(S.minute)}</span></div><div class="emptyCall">${icon('phone')}<h3>${esc(t('noCall'))}</h3><div class="signalBars">${Array.from({length:29},(_,i)=>`<i style="--h:${4+Math.sin(i*.8)**2*20}px;--d:${i*.09}s"></i>`).join('')}</div>${S.lastClosed?`<div style="border-top:1px solid #3c5036;padding-top:14px;text-align:left;width:100%"><p class="eyebrow">${esc(L(C(S.lastClosed).caller))} · ${esc(t('handled'))}</p><p id="closingSpeech" style="max-width:none;color:#bbcdad;margin-top:8px">${esc(L(C(S.lastClosed).close))}</p></div>`:''}<p>${esc(t(Object.values(S.calls).some(x=>x.status==='ringing')?'standby':'allQuiet'))}</p></div></div>`;return;}
$('#callBody').innerHTML=`<div class="callSurface"><div class="callMeta"><span><i class="dot"></i> ${esc(t('connected'))}</span><span>${esc(t('callId'))} / ${c.id.slice(1)}</span></div><h2 class="callerName">${esc(L(c.caller))}</h2><div class="callAddress">${esc(L(loc(c.address)?.name))} · ${clock(cs.answeredAt)}</div><div id="transcript" class="transcript" aria-live="polite">${cs.log.map((e,i)=>`${e.kind==='q'?`<p class="you">↳ ${esc(L(c.questions.find(q=>q.id===e.id)?.ask))}</p>`:''}<p data-speech-entry="${i}">${esc(callText(c,e))}</p>`).join('')}</div><div class="callControls">${action('replaySpeech',icon('volume')+esc(t('replay')),'ghost small')}${action('hold',esc(t('hold')),'ghost small')}</div></div><div class="responses" aria-label="${esc(t('questions'))}">${c.questions.map(q=>action('question',esc(L(q.ask)),`response ${cs.asked.includes(q.id)?'asked':''}`,`data-id="${q.id}" ${cs.asked.includes(q.id)?'disabled':''}`)).join('')}</div><div class="callEnd"><label class="sr-only" for="classification">${esc(t('classify'))}</label><select id="classification"><option value="">${esc(t('classify'))}</option>${['police','fire','medical','talk'].map(x=>`<option value="${x}" ${cs.classified===x?'selected':''}>${esc(t(x))}</option>`).join('')}</select>${action('record',esc(t('record')),'primary',`${!cs.classified?'disabled':''} id="recordButton"`)}</div>`;const tr=$('#transcript');tr.scrollTop=tr.scrollHeight;}
function speakCurrent(){if(!S.active)return;let c=C(S.active),cs=S.calls[S.active],entry=cs.log[cs.log.length-1];audio.setCallAmbient(c.ambient);if(entry)speak(callText(c,entry),c.voice,$(`[data-speech-entry="${cs.log.length-1}"]`));}
function speak(text,profile={},target=null){audio.stopSpeech();const token=++speechToken;lastSpeech={text,profile};if(target){target.innerHTML=text.split(/(\s+)/).map((word,i,arr)=>{const index=arr.slice(0,i).join('').length;return /\s+/.test(word)?esc(word):`<span data-word="${index}" data-length="${word.length}">${esc(word)}</span>`}).join('')}
return audio.speak(text,lang,profile,{onWord:(i,length)=>{if(token!==speechToken||!target?.isConnected)return;target.querySelector('.spoken')?.classList.remove('spoken');const spans=[...target.querySelectorAll('[data-word]')];const w=spans.find(s=>+s.dataset.word<=i&&+s.dataset.word+(+s.dataset.length)>i)||spans.find(s=>+s.dataset.word>=i);w?.classList.add('spoken');const tr=target.closest('.transcript');if(tr&&w){const wr=w.getBoundingClientRect(),rr=tr.getBoundingClientRect();if(wr.top<rr.top||wr.bottom>rr.bottom)tr.scrollTop+=wr.top-rr.top-20}},onEnd:()=>target?.querySelector('.spoken')?.classList.remove('spoken')});}
function stopVoice(){speechToken++;audio.stopSpeech();audio.setCallAmbient(null)}
function answer(id){if(!id||!S.calls[id])return;const cs=S.calls[id],c=C(id);if(!['ringing','active','held'].includes(cs.status))return;if(S.active&&S.active!==id)S.calls[S.active].status='held';S.active=id;cs.status='active';if(cs.answeredAt===undefined){cs.answeredAt=S.minute;cs.log=[{kind:'opening'}];if(c.followup){cs.log.push({kind:'followup',helped:!!S.calls[c.followup.requires]?.helped})}}
audio.effect('click');audio.setCallAmbient(c.ambient);renderCalls();syncVisuals();if(cs.log.length===2&&cs.log[1].kind==='followup'){const seqToken=speechToken+1;speak(L(c.opening),c.voice,$('[data-speech-entry="0"]')).then(()=>{if(speechToken===seqToken&&S.active===id)speakCurrent()})}else speakCurrent();persist();}
function question(id){const c=C(S.active),cs=S.calls[S.active];if(!c||!cs||cs.asked.includes(id))return;const q=c.questions.find(q=>q.id===id);if(!q)return;cs.asked.push(id);cs.log.push({kind:'q',id});if(q.trust)cs.trust=true;audio.effect('click');renderCalls();speakCurrent();persist();}
function hold(){if(!S.active)return;S.calls[S.active].status='held';S.active=null;stopVoice();renderCalls();toast(t('holdToast'));persist();}
function recordCall(){const c=C(S.active),cs=S.calls[S.active];if(!c||!cs||!cs.classified)return;cs.log.push({kind:'close'});const id=S.active;cs.status=cs.classified==='talk'?'resolved':'pending';if(cs.classified==='talk'){cs.helped=c.service==='talk';cs.care=cs.asked.length>0;cs.closedAt=S.minute;if(c.service!=='talk'){cs.status='pending';cs.classified=c.service;addRadio({kind:'wrong',id});}}
S.selectedLocation=c.address;S.lastClosed=id;S.active=null;stopVoice();audio.effect('click');renderCalls();renderMapInfo();syncVisuals();speak(L(c.close),c.voice,$('#closingSpeech'));toast(t(cs.status==='pending'?'pendingToast':'care'));persist();}
function renderUnits(){const grid=$('#unitGrid');if(!grid)return;grid.innerHTML=S.units.map(u=>`<button class="unit ${u.status!=='available'?'busy':''} ${S.selectedUnit===u.id?'selected':''}" data-unit="${u.id}" data-action="unit" data-id="${u.id}" aria-label="${esc(unitName(u)+' · '+t(u.type)+' · '+t(u.status==='available'?'ready':u.status))}" aria-pressed="${S.selectedUnit===u.id}" draggable="false">${icon(u.type)}<strong>${unitName(u)}</strong><small>${esc(t(u.status==='available'?'ready':u.status))}</small>${u.status!=='available'?`<i class="unitProgress" style="width:${Math.min(100,Math.max(0,(S.minute-u.start)/(u.freeAt-u.start)*100))}%"></i>`:''}</button>`).join('');$('#unitCount').textContent=`${S.units.filter(u=>u.status==='available').length} / ${S.units.length} ${t('free')}`;}
function unitSelect(id){const u=S.units.find(u=>u.id===id);if(!u||u.status!=='available'){toast(t('busy'));return}S.selectedUnit=S.selectedUnit===id?null:id;audio.effect('click');renderUnits();renderMapInfo();if(S.selectedUnit)toast(t('selectedUnit'));}
function selectLocation(id){S.selectedLocation=id;renderMapInfo();syncVisuals();if(S.selectedUnit){const targets=Object.keys(S.calls).filter(cid=>C(cid).address===id&&S.calls[cid].status==='pending');if(targets.length===1)dispatchUnit(S.selectedUnit,targets[0]);else if(targets.length>1)showModal('dispatch',{location:id});else toast(t('noIncidents'));}}
function renderMapInfo(){if(!$('#mapInfo'))return;const l=loc(S.selectedLocation),cases=Object.keys(S.calls).filter(id=>C(id).address===S.selectedLocation),pending=cases.filter(id=>S.calls[id].status==='pending');$('#mapInfo').innerHTML=`${S.minute>=480?action('finale',esc(t('finalDecision')),'primary','style="width:100%;margin-top:12px"'):''}<p class="mapInstructions">${esc(t(S.selectedUnit?'selectedUnit':'chooseMarker'))}</p>${l?`<div class="mapFocus"><div><strong>${esc(L(l.name))}</strong><small>${pending.length?esc(t('pending')):esc(t(cases.length?'handled':'mapOnline'))}</small></div>${pending.length?action('dispatchMenu',esc(t('dispatch')),'small',`data-id="${l.id}"`):''}</div>`:''}`;
const open=Object.keys(S.calls).filter(id=>S.calls[id].status==='pending');$('#pendingItems').innerHTML=open.map(id=>action('focusIncident',`${C(id).id.slice(1)} · ${esc(L(loc(C(id).address)?.name))}`,'',`data-id="${id}"`)).join('');}
function travelDuration(u,c){const p=loc(c.address);let distance=Math.hypot(p.x-u.x,p.y-u.y),flood=S.minute/480;return 3+distance/5.5+flood*6+(p.x>55&&u.x<45?flood*7:0);}
function dispatchUnit(uid,cid){const u=S.units.find(u=>u.id===uid),c=C(cid),cs=S.calls[cid];if(!u||u.status!=='available'){toast(t('busy'));return}if(!cs||cs.status!=='pending'){toast(t('notReady'));return}const p=loc(c.address),travel=travelDuration(u,c);u.status='travel';u.call=cid;u.start=S.minute;u.arriveAt=S.minute+travel;u.freeAt=u.arriveAt+7+c.urgency*2;u.fromX=u.x;u.fromY=u.y;u.targetX=p.x;u.targetY=p.y;cs.status='travel';cs.dispatchAt=S.minute;cs.unit=uid;S.selectedUnit=null;addRadio({kind:'dispatch',id:cid,unit:uid,eta:Math.ceil(travel)});closeModal();audio.effect('radio');renderUnits();renderMapInfo();syncVisuals();toast(t('dispatched'));persist();}
function deadline(c){return c.urgency===3?34:c.urgency===2?49:75;}
function processUnits(){let changed=false;for(const u of S.units){if(u.status==='travel'&&S.minute>=u.arriveAt){const c=C(u.call),cs=S.calls[u.call];u.x=u.targetX;u.y=u.targetY;u.status='scene';cs.arrivedAt=S.minute;if(u.type===c.service||c.service==='talk'){cs.helped=S.minute-cs.ringAt<=deadline(c);cs.status='scene';addRadio({kind:'report',id:c.id,unit:u.id,late:!cs.helped});cs.reported=true;}else{cs.status='pending';cs.classified=c.service;addRadio({kind:'wrong',id:c.id,unit:u.id});u.freeAt=S.minute+3;}changed=true;}
if(u.status==='scene'&&S.minute>=u.freeAt){const cs=S.calls[u.call];if(cs.status==='scene')cs.status=cs.helped?'resolved':'missed';u.status='available';addRadio({kind:'return',unit:u.id});u.call=null;changed=true;}}
if(changed){renderUnits();renderMapInfo();persist();}}
function radioText(r){if(r.kind==='system')return t(r.key);if(r.kind==='check')return t('statusCheck')+' '+r.units.map(u=>unitName(u.id)+': '+t(u.status==='available'?'ready':u.status)+(u.eta?' · '+minuteLabel(u.eta):'')).join('; ')+'.';if(r.kind==='dispatch')return `${unitName(r.unit)} → ${L(loc(C(r.id).address)?.name)}. ${t('travel')} · ${minuteLabel(r.eta)}.`;if(r.kind==='return')return `${unitName(r.unit)}. ${t('returning')}`;if(r.kind==='wrong')return `${r.unit?unitName(r.unit)+'. ':''}${t('wrongUnit')} ${t('wrongService')}${t(C(r.id).service)}.`;if(r.kind==='report')return `${unitName(r.unit)}. ${L(C(r.id)[r.late?'lateReport':'report'])}`;return '';}
function addRadio(entry){const r={...entry,time:S.minute};S.radios.push(r);if(S.radios.length>120)S.radios.shift();renderRadio();if(entry.kind==='report'&&!S.active&&!modal){audio.effect('radio');speak(radioText(r),{pitch:.82,rate:.94,variant:3})}else if(entry.kind==='report')audio.effect('radio');}
function renderRadio(){const el=$('#radioDisplay');if(!el)return;el.innerHTML=S.radios.slice(-10).map(r=>`<p class="radioMessage"><span class="time">${clock(r.time)}</span>${esc(radioText(r))}</p>`).join('');el.scrollTop=el.scrollHeight;}
function foundClues(){return STORY.clues.filter(x=>{const cs=S.calls[x.call];return cs&&(x.question==='report'?cs.reported:cs.asked.includes(x.question))})}
function transcriptFull(c,cs){return cs.log.map(e=>`<p>${e.kind==='q'?`<strong>↳ ${esc(L(c.questions.find(q=>q.id===e.id)?.ask))}</strong><br>`:''}${esc(callText(c,e))}</p>`).join('')+(cs.reported?`<p><strong>${esc(t('radio'))}</strong><br>${esc(L(c[cs.helped?'report':'lateReport']))}</p>`:'');}
function renderTab(){const el=$('#tabPane');if(!el)return;const entries=Object.keys(S.calls).filter(id=>S.calls[id].answeredAt!==undefined),clues=foundClues();
if(tab==='logbook'){el.innerHTML=`<div class="paper"><div class="paperHeader"><div><h2>${esc(t('notebookTitle'))}</h2><p class="eyebrow">${esc(t('notebookSubtitle'))}</p></div><div class="eyebrow">${clock(S.minute)}<br>04 / ${entries.length.toString().padStart(2,'0')}</div></div><div class="notebookTools"><p>${esc(t('linkInstruction'))}</p>${action('connect',icon('link')+` ${esc(t('connect'))} (${S.pins.length}/2)`,'',`${S.pins.length!==2?'disabled':''}`)}${action('clearPins',esc(t('clearPins')),'small')}</div>${S.links.map(id=>{const c=conn(id);return `<div class="connection"><h3>↳ ${esc(L(c.title))}</h3><p>${esc(L(c.text))}</p></div>`}).join('')}<div class="notebookGrid">${entries.length?entries.map(id=>{const c=C(id),cs=S.calls[id],cc=clues.filter(x=>x.call===id);return `<article class="logEntry"><div class="entryTop"><span>${esc(t('entry'))} ${id.slice(1)} / ${clock(cs.answeredAt)}</span>${action('star',cs.starred?'●':'○','ghost small',`data-id="${id}" aria-label="${esc(t(cs.starred?'unstar':'star'))}"`)}</div><h3>${esc(L(c.caller))}</h3><p class="address">${esc(L(loc(c.address)?.name))}</p><blockquote>“${esc(L(c.opening).split(/[.!?。]/)[0])}”</blockquote>${cc.map(cl=>action('pin',esc(L(cl.label)),`cluePin ${S.pins.includes(cl.id)?'selected':''} ${S.links.some(k=>conn(k).clues.includes(cl.id))?'linked':''}`,`data-id="${cl.id}" aria-pressed="${S.pins.includes(cl.id)}"`)).join('')}<details><summary>${esc(t('transcriptLabel'))} ${cs.asked.length}/${c.questions.length}</summary>${transcriptFull(c,cs)}</details></article>`}).join(''):`<p class="emptyPaper">${esc(t('noEntries'))}<br>${esc(t('noClues'))}</p>`}</div></div>`;}
if(tab==='archive'){el.innerHTML=`<div class="paper"><div class="paperHeader"><div><h2>${esc(t('callsArchive'))}</h2><p class="eyebrow">${esc(t('registerSubtitle'))}</p></div><span>${clock(S.minute)}</span></div><div class="archiveList">${Object.keys(S.calls).length?Object.keys(S.calls).map(id=>{const c=C(id),cs=S.calls[id];return `<div class="archiveRow"><span>${clock(cs.ringAt)}</span><div><strong>${esc(cs.answeredAt!==undefined?L(c.caller):t('waiting'))}</strong><br><small>${esc(L(loc(c.address)?.name))} · ${esc(t(cs.classified||'none'))}</small>${cs.answeredAt!==undefined?`<details><summary>${esc(t('review'))}</summary>${transcriptFull(c,cs)}</details>`:''}</div><span>${esc(t(cs.status==='resolved'?'resolved':cs.status==='missed'?'missed':cs.status==='pending'?'pending':cs.status==='travel'?'travel':cs.status==='scene'?'scene':cs.status==='ringing'?'waiting':'answered'))}</span></div>`}).join(''):`<p class="emptyPaper">${esc(t('noEntries'))}</p>`}</div></div>`;}}
function setTab(name){if(name==='guide'){showModal('guide');return}stopVoice();tab=name;renderGame();window.scrollTo({top:0,behavior:'instant'});persist();}
function pin(id){if(S.pins.includes(id))S.pins=S.pins.filter(x=>x!==id);else if(S.pins.length<2)S.pins.push(id);else{toast(t('pinLimit'));return}audio.effect('click');renderTab();persist();}
function connectPins(){if(S.pins.length!==2){toast(t('pinLimit'));return}const connection=STORY.connections.find(c=>c.clues.length===2&&c.clues.every(x=>S.pins.includes(x)));if(!connection){toast(t('linkMiss'));return}if(S.links.includes(connection.id)){toast(t('linkExists'));return}S.links.push(connection.id);S.pins=[];audio.effect('link');renderTab();toast(t('linked'));persist();}
function syncVisuals(){const h=S.minute/60;roomView?.setState({hour:started?h:1,tension:Math.min(1,h/6),quality:settings.quality,reducedMotion:settings.motion});audio.setScene({hour:h,tension:Math.min(1,h/9+Object.values(S.calls).filter(c=>c.status==='ringing').length*.12),emotional:!S.ending&&!!S.active&&C(S.active)?.service==='talk',dawn:!!S.ending||h>=8});if(!mapView)return;mapView.setState({locations:STORY.locations,lang,hour:h,time:22+h,markers:Object.keys(S.calls).map(id=>({id,location:C(id).address,status:({held:'ringing',travel:'pending',scene:'active'}[S.calls[id].status]||S.calls[id].status),urgent:C(id).urgency===3})),units:S.units.map(u=>({...u,id:unitName(u),x:u.status==='travel'?u.fromX:u.x,y:u.status==='travel'?u.fromY:u.y,progress:u.status==='travel'?Math.min(1,(S.minute-u.start)/(u.arriveAt-u.start)):0})),selected:S.selectedLocation,links:S.links.map(id=>{const a=conn(id).clues.map(cid=>C(clue(cid).call).address);return {from:a[0],to:a[1]}}),power:Math.max(0,(h-2)/7),flood:Math.max(0,(h-1)/7),reducedMotion:settings.motion});}
function updateClock(){const c=$('#clock');if(c)c.textContent=clock(S.minute);if($('#weatherLabel'))$('#weatherLabel').textContent=t(S.minute>=465?'dawn':S.minute>220?'stormSevere':'storm');if($('#shiftFill'))$('#shiftFill').style.width=`${S.minute/480*100}%`;if($('.tinyCoffee'))$('.tinyCoffee').style.setProperty('--coffee',`${Math.max(4,95-S.minute/5.1)}%`);if($('#clockStatus'))$('#clockStatus').textContent=t(modal||tab!=='console'?'paused':'ticking');if($('#saveStatus'))$('#saveStatus').textContent=t(saveBlocked?'saveUnavailable':'saved');}
function scheduleCalls(){let changed=false;for(const c of STORY.calls){const at=c.hour*60+c.at/5;if(S.minute>=at&&!S.calls[c.id]){S.calls[c.id]={status:'ringing',ringAt:at,asked:[],log:[],classified:null,helped:false};changed=true;}}
if(changed){audio.effect('ring');renderLines();syncVisuals();$('#announcer').textContent=t('callWaiting');persist();}}
function newHour(hour){S.seenHour=hour;checkpoints[hour]=JSON.parse(JSON.stringify(S));if(hour===2)addRadio({kind:'system',key:'floodRadio'});if(hour===4)addRadio({kind:'system',key:'outageRadio'});persist();showModal('chapter',{hour});}
function gameTick(dt){if(!started||S.ending||booting||modal||tab!=='console'||document.hidden)return;const duration={relaxed:420,standard:360,intense:330}[settings.pace]||360;S.minute=Math.min(480,S.minute+dt*60/duration);processUnits();scheduleCalls();let h=currentHour();if(h>S.seenHour){newHour(h);return}if(S.minute>=480&&!S.choice&&!S.finalOffered){S.finalOffered=true;showModal('finale');renderMapInfo();return}}
function modalShell(title,body,footer='',cls=''){return `<div class="overlay ${cls}" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}" tabindex="-1"><div class="modalHeader"><h2>${esc(title)}</h2>${action('closeModal',icon('close'),'ghost iconButton',`aria-label="${esc(t('close'))}"`)}</div>${body}${footer?`<div class="modalActions">${footer}</div>`:''}</section></div>`;}
let modalReturnFocus=null;
function showModal(type,data={}){stopVoice();modalReturnFocus=document.activeElement;modal={type,...data};renderModal();updateClock();setTimeout(()=>$('#modalRoot .modal')?.focus(),30)}
function closeModal(){const was=modal;modal=null;$('#modalRoot').innerHTML='';stopVoice();updateClock();if(modalReturnFocus?.isConnected)modalReturnFocus.focus();if(was?.type==='lastCall')renderEnding();}
function renderModal(){if(!modal){$('#modalRoot').innerHTML='';return}const m=modal;let out='';
if(m.type==='settings'){const select=(id,items)=>`<select id="${id}">${items.map(([v,k])=>`<option value="${v}" ${settings[id]===v?'selected':''}>${esc(t(k))}</option>`).join('')}</select>`;out=modalShell(t('settings'),`<div class="setting"><label for="language">${esc(t('language'))}</label><select id="language"><option value="en" ${lang==='en'?'selected':''}>${lang==='ru'?'Английский':'English'}</option><option value="ru" ${lang==='ru'?'selected':''}>Русский</option></select></div><div class="setting"><label for="volume">${esc(t('volume'))}</label><input id="volume" type="range" min="0" max="1" step=".05" value="${settings.volume}"></div><div class="setting"><label for="speech">${esc(t('speech'))}</label><input id="speech" type="checkbox" ${settings.speech?'checked':''}></div><div class="setting"><label for="pace">${esc(t('pace'))}</label>${select('pace',[['relaxed','relaxed'],['standard','standard'],['intense','intense']])}</div><div class="setting"><label for="textSize">${esc(t('textSize'))}</label>${select('textSize',[['normal','normal'],['large','large'],['extra','extra']])}</div><div class="setting"><label for="motion">${esc(t('motion'))}</label><input id="motion" type="checkbox" ${settings.motion?'checked':''}></div><div class="setting"><label for="quality">${esc(t('quality'))}</label>${select('quality',[['auto','auto'],['low','low'],['high','high']])}</div><p class="settingsNote">${esc(t('voiceNote'))}</p><p class="settingsNote">${esc(t('settingsNote'))}</p>`,`${action('confirmRestart',esc(t('startOver')),'danger')}${action('closeModal',esc(t('back')),'primary')}`);}
if(m.type==='confirmRestart')out=modalShell(t('restartTitle'),`<p>${esc(t('restartText'))}</p>`,action('settings',esc(t('cancel')))+action('restart',esc(t('confirmRestart')),'primary'));
if(m.type==='guide')out=modalShell(t('tutorialTitle'),`<p>${esc(t('tutorialIntro'))}</p>${[1,2,3,4].map(i=>`<div class="tutorialRow"><b>0${i}</b><p>${esc(t('step'+i))}</p></div>`).join('')}`,action('closeModal',esc(t('understood')),'primary'));
if(m.type==='pause')out=modalShell(t('pauseTitle'),`<p>${esc(t('pauseText'))}</p>`,action('closeModal',esc(t('resumeClock')),'primary'));
if(m.type==='chapter'){const chapter=STORY.chapters[m.hour];out=modalShell(`${clock(m.hour*60)} — ${L(chapter.title)}`,`<p class="eyebrow">${esc(t('chapter'))} / ${String(m.hour+1).padStart(2,'0')}</p><p>${esc(L(chapter.intro))}</p>${m.hour===0?`<div class="tutorialRow"><b>01</b><p>${esc(t('step1'))}</p></div><div class="tutorialRow"><b>02</b><p>${esc(t('step2'))}</p></div><div class="tutorialRow"><b>03</b><p>${esc(t('step3'))}</p></div>`:''}`,action('closeModal',esc(t(m.hour===0?'continue':'newChapter')),'primary'),'chapterOverlay');}
if(m.type==='hint'){const hour=currentHour(),level=Math.max(1,S.hints[hour]);out=modalShell(t('hintName'),`<div class="hintSteps">${[1,2,3].map(i=>`<span class="${i<=level?'used':''}"></span>`).join('')}</div><p class="eyebrow">${esc(t('hintLevel'))} ${level}/3 · ${clock(hour*60)}</p><p class="hintVoice" id="hintSpeech">${esc(L(STORY.chapters[hour].hints[level-1]))}</p>`,action('nextHint',esc(t(level<3?'nextHint':'repeatHint')))+action('closeModal',esc(t('back')),'primary'));}
if(m.type==='dispatch'){const targets=Object.keys(S.calls).filter(id=>C(id).address===m.location&&S.calls[id].status==='pending');out=modalShell(t('dispatchTitle'),`<p>${esc(L(loc(m.location)?.name))}</p><div class="dispatchMenu">${targets.map(id=>`<p>${esc(L(C(id).caller))} · ${esc(t(S.calls[id].classified))}</p>${S.units.filter(u=>u.status==='available').map(u=>action('sendUnit',`${esc(unitName(u))} · ${esc(t(u.type))}<small>${esc(minuteLabel(Math.ceil(travelDuration(u,C(id)))))} · ${esc(t('routing'))}</small>`,'',`data-id="${u.id}" data-call="${id}"`)).join('')}`).join('')}${!S.units.some(u=>u.status==='available')?`<p>${esc(t('noUnits'))}</p>`:''}</div>`,action('closeModal',esc(t('back'))));}
if(m.type==='finale'){out=modalShell(t('finalDecision'),`<p>${esc(L(STORY.finale.intro))}</p>${STORY.finale.choices.map(c=>{const locked=c.requires?.some(k=>!S.links.includes(k));return action('decision',`${locked?'○ ':'↳ '}${esc(L(c.title))}<small>${esc(locked?t('decisionLocked'):L(c.text))}</small>`,`choice ${locked?'locked':''}`,`data-id="${c.id}" ${locked?'disabled':''}`)}).join('')}`,action('closeModal',esc(t('decisionBack'))));}
if(m.type==='lastCall'){const e=STORY.endings.find(e=>e.id===S.ending);out=modalShell(t('lastCall'),`<p class="hintVoice" id="lastSpeech">${esc(L(e.lastCall))}</p>`,action('showReport',esc(t('report')),'primary'));}
$('#modalRoot').innerHTML=out;}
function getEnding(choice){if(choice==='relay'){return S.links.length===STORY.connections.length&&S.calls.c11?.helped&&S.calls.c26?.helped?STORY.endings[0].id:STORY.endings[1].id}if(choice==='evacuate')return STORY.endings[2].id;return STORY.endings[3].id;}
function finishShift(choice){S.choice=choice;S.ending=getEnding(choice);S.minute=480;if(!reached.includes(S.ending))reached.push(S.ending);stopVoice();syncVisuals();persist();showModal('lastCall');speak(L(STORY.endings.find(e=>e.id===S.ending).lastCall),{pitch:1.02,rate:.88,variant:2},$('#lastSpeech'));}
function renderEnding(){clearInterval(reportTimer);started=true;$('#game').hidden=true;$('#titleScreen').hidden=true;$('#endingScreen').hidden=false;mapView?.destroy();mapView=null;const e=STORY.endings.find(x=>x.id===S.ending),answered=Object.values(S.calls).filter(c=>c.answeredAt!==undefined),helped=Object.entries(S.calls).filter(([id,c])=>c.helped).reduce((n,[id,c])=>n+C(id).people,0),responses=Object.values(S.calls).filter(c=>c.arrivedAt!==undefined),avg=responses.length?Math.round(responses.reduce((n,c)=>n+c.arrivedAt-c.ringAt,0)/responses.length):0,rank=S.ending===STORY.endings[0].id?'rank4':helped>=45?'rank3':S.links.length>=2?'rank2':'rank1';
$('#endingScreen').innerHTML=`<div class="endScreen"><article class="paper"><div class="paperHeader"><div><p class="endLabel">${esc(t('shiftReport'))}</p><h2>${esc(t('shiftComplete'))}</h2></div><span>06:00</span></div><p class="eyebrow">${esc(t('endingReached'))} ${STORY.endings.indexOf(e)+1} / 4</p><h1 class="endTitle">${esc(L(e.title))}</h1><div class="endingText" id="reportText">${esc(L(e.text))}</div><blockquote class="lastCall">${esc(L(e.lastCall))}</blockquote><div class="stats">${[[answered.length,t('callsAnswered')],[helped,t('livesHelped')],[avg?avg+' '+t('minutes'):'—',t('avgResponse')],[S.links.length+'/'+STORY.connections.length,t('connectionsFound')],[`${reached.length} / 4`,t('endingsRecorded')],['22:00—06:00',t('elapsed')]].map(([v,l])=>`<div class="stat"><strong>${esc(v)}</strong><small>${esc(l)}</small></div>`).join('')}</div><p class="eyebrow">${esc(t('rank'))}</p><div class="rank">${esc(t(rank))}</div><p style="font-size:11px;margin-top:24px">${esc(t('replayNote'))}</p><div class="endingFooter"><label class="sr-only" for="replayHour">${esc(t('replayHour'))}</label><select id="replayHour" class="replayHour">${Object.keys(checkpoints).sort((a,b)=>a-b).map(h=>`<option value="${h}">${clock(h*60)} · ${esc(L(STORY.chapters[h].title))}</option>`).join('')}</select>${action('replayHour',esc(t('replay')))}${action('confirmRestart',esc(t('newGame')))}${action('settings',icon('gear'),'iconButton',`aria-label="${esc(t('settings'))}"`)}</div></article></div>`;roomView?.setState({hour:8,tension:0,quality:settings.quality,reducedMotion:settings.motion});if(!settings.motion){const el=$('#reportText'),value=L(e.text);let n=0;el.setAttribute('aria-label',value);el.textContent='';reportTimer=setInterval(()=>{if(!el.isConnected){clearInterval(reportTimer);return}n=Math.min(value.length,n+12);el.textContent=value.slice(0,n);if(n>=value.length)clearInterval(reportTimer)},32)}}
function switchLanguage(value){$('#toast').hidden=true;lang=value==='ru'?'ru':'en';stopVoice();applySettings();if(started){if(S.ending)renderEnding();else renderGame()}else renderTitle();if(modal)renderModal();persist();}
async function beginShift(fresh=false){await audio.start();applySettings();if(fresh){S=makeRun();checkpoints={}}started=true;$('#titleScreen').hidden=true;$('#endingScreen').hidden=true;$('#game').hidden=false;titleMap?.destroy();titleMap=null;tab='console';if(S.ending){renderEnding();return}renderGame();if(S.seenHour<0){showBoot()}else{syncVisuals();if(S.active){audio.setCallAmbient(C(S.active).ambient);speakCurrent()}}persist();}
function showBoot(){booting=true;audio.effect('door');$('#modalRoot').innerHTML=`<div class="boot"><div class="bootContent"><div class="bootLine">${esc(t('boot1'))}</div><div class="bootLine">${esc(t('boot2'))}</div><div class="bootLine">${esc(t('boot3'))}</div><p class="bootQuote" id="bootSpeech">${esc(L(STORY.handover))}</p>${action('finishBoot',esc(t('continue'))+` ${icon('arrow')}`,'primary')}</div>${action('finishBoot',esc(t('skip')),'bootSkip')}</div>`;setTimeout(()=>{if(booting)audio.effect('power')},700);setTimeout(()=>{if(booting)speak(L(STORY.handover),{pitch:.78,rate:.9,variant:4},$('#bootSpeech'))},2400);}
function finishBoot(){if(!booting)return;booting=false;stopVoice();$('#modalRoot').innerHTML='';newHour(0);}
function replayFromHour(hour){if(!checkpoints[hour])return;S=JSON.parse(JSON.stringify(checkpoints[hour]));S.ending=null;S.choice=null;S.finalOffered=false;S.seenHour=Number(hour);for(const h of Object.keys(checkpoints))if(+h>+hour)delete checkpoints[h];modal=null;$('#modalRoot').innerHTML='';beginShift();showModal('chapter',{hour:Number(hour)});persist();}
async function handleAction(button){const a=button.dataset.action,id=button.dataset.id;if(button.disabled)return;if(a==='lang-en'||a==='lang-ru'){switchLanguage(a.slice(-2));return}if(a==='start'){beginShift();return}if(a==='settings'){showModal('settings');return}if(a==='closeModal'){closeModal();return}if(a==='confirmRestart'){showModal('confirmRestart');return}if(a==='restart'){closeModal();beginShift(true);return}if(a==='finishBoot'){finishBoot();return}if(['console','logbook','archive','guide'].includes(a)){setTab(a);return}if(a==='answer'){answer(id);return}if(a==='question'){question(id);return}if(a==='hold'){hold();return}if(a==='record'){recordCall();return}if(a==='unit'){unitSelect(id);return}if(a==='dispatchMenu'){showModal('dispatch',{location:id});return}if(a==='sendUnit'){dispatchUnit(id,button.dataset.call);return}if(a==='focusIncident'){S.selectedLocation=C(id).address;renderMapInfo();syncVisuals();showModal('dispatch',{location:C(id).address});return}if(a==='pin'){pin(id);return}if(a==='connect'){connectPins();return}if(a==='clearPins'){S.pins=[];renderTab();persist();return}if(a==='star'){S.calls[id].starred=!S.calls[id].starred;renderTab();persist();return}if(a==='hint'||a==='nextHint'){const h=currentHour();S.hints[h]=Math.min(3,S.hints[h]+1);showModal('hint');speak(L(STORY.chapters[h].hints[S.hints[h]-1]),{pitch:.76,rate:.87,variant:5},$('#hintSpeech'));persist();return}if(a==='replaySpeech'){if(S.active)speakCurrent();return}if(a==='radioCheck'){const r={kind:'check',units:S.units.map(u=>({id:u.id,status:u.status,eta:u.status==='travel'?Math.ceil(u.arriveAt-S.minute):0}))};addRadio(r);audio.effect('radio');if(!S.active)speak(radioText(r),{pitch:.82,rate:.94,variant:3});persist();return}if(a==='pause'){showModal('pause');return}if(a==='finale'){showModal('finale');return}if(a==='decision'){const choice=STORY.finale.choices.find(c=>c.id===id);if(choice?.requires?.some(x=>!S.links.includes(x)))return;finishShift(id);return}if(a==='showReport'){modal=null;$('#modalRoot').innerHTML='';stopVoice();renderEnding();return}if(a==='replayHour'){replayFromHour($('#replayHour').value);return}}
document.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(button){if(drag?.suppress){drag=null;event.preventDefault();return}handleAction(button)}});
document.addEventListener('change',event=>{const el=event.target;if(el.id==='classification'&&S.active){S.calls[S.active].classified=el.value||null;$('#recordButton').disabled=!el.value;persist();return}if(el.id==='language'){switchLanguage(el.value);return}if(['speech','pace','textSize','motion','quality'].includes(el.id)){settings[el.id]=el.type==='checkbox'?el.checked:el.value;applySettings();if(started&&!S.ending&&tab==='console')syncVisuals();persist();}});
document.addEventListener('input',e=>{if(e.target.id==='volume'){settings.volume=+e.target.value;audio.setVolume(settings.volume);persist()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(booting)finishBoot();else if(modal)closeModal();return}if(e.key==='Tab'&&modal){const items=[...$('#modalRoot').querySelectorAll('button:not(:disabled),select,input,summary,[tabindex="0"]')];if(!items.length)return;const first=items[0],last=items[items.length-1];if(e.shiftKey&&(document.activeElement===first||document.activeElement===$('#modalRoot .modal'))){last.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault()}}});
document.addEventListener('pointerdown',e=>{const el=e.target.closest('[data-unit]');if(!el||S.units.find(u=>u.id===el.dataset.unit)?.status!=='available')return;drag={id:el.dataset.unit,startX:e.clientX,startY:e.clientY,moved:false,pointer:e.pointerId};});
document.addEventListener('pointermove',e=>{if(!drag||drag.pointer!==e.pointerId)return;if(Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)>8&&!drag.moved){drag.moved=true;const ghost=document.createElement('div');ghost.className='dragGhost';ghost.id='dragGhost';ghost.textContent=unitName(drag.id);document.body.appendChild(ghost)}if(drag.moved){e.preventDefault();$('#dragGhost').style.left=e.clientX+'px';$('#dragGhost').style.top=e.clientY+'px'}},{passive:false});
document.addEventListener('pointerup',e=>{if(!drag)return;if(drag.moved){const location=mapView?.getLocationAt(e.clientX,e.clientY);$('#dragGhost')?.remove();const uid=drag.id;drag={suppress:true};if(location){S.selectedUnit=uid;selectLocation(location)}setTimeout(()=>{drag=null},200)}else drag=null});
document.addEventListener('pointercancel',()=>{$('#dragGhost')?.remove();drag=null});
document.addEventListener('visibilitychange',()=>{persist();if(document.hidden){stopVoice();audio.suspend()}else{lastTick=performance.now();if(started)audio.resume()}});
window.addEventListener('pagehide',persist);
function frame(now){const dt=Math.min(1,(now-lastTick)/1000);lastTick=now;gameTick(dt);if(now-lastPaint>950){lastPaint=now;if(started&&!S.ending){updateClock();syncVisuals();if(!drag)renderUnits();if(!modal&&tab==='console'&&Object.values(S.calls).some(c=>c.status==='ringing')&&now-lastRing>6500){audio.effect('ring');lastRing=now}}}if(now-lastSave>5000){lastSave=now;if(started)persist()}requestAnimationFrame(frame)}
roomView=new DispatchRoom($('#room'));applySettings();renderTitle();requestAnimationFrame(frame);

</script>
